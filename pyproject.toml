[project]
name = "crewai_firecrawl_mcp_test"
version = "0.1.0"
description = "crewai-firecrawl-mcp-test using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.8",
    # crewai 1.6.1's HTTP transport imports mcp.client.streamable_http.streamablehttp_client,
    # which mcp 2.x renamed to streamable_http_client.
    "mcp>=1.9.0,<2",
]

[project.scripts]
kickoff = "crewai_firecrawl_mcp_test.main:kickoff"
run_crew = "crewai_firecrawl_mcp_test.main:kickoff"
plot = "crewai_firecrawl_mcp_test.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
